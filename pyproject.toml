[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketlens"
version = "0.1.0"
description = "MarketLens - End-to-End Marketing Intelligence Platform uniting tabular ETL, classical NLP, and evidence-grounded LLM insights."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "streamlit>=1.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["marketlens*"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".git/", "__pycache__/", ".venv/", ".ruff_cache/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["N806", "N803"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
